[workspace]
resolver = "2"
members = ["crates/cs-probe", "crates/squeeze-cli", "app/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/plawanpawin-byte/squzze"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

