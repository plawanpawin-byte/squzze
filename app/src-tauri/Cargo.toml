[package]
name = "squeeze"
version = "0.2.0"
description = "Squeeze - free batch media transcoder"
authors = ["Squeeze contributors"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
cs-probe = { path = "../../crates/cs-probe" }
cs-ffmpeg = { path = "../../crates/cs-ffmpeg" }
cs-queue = { path = "../../crates/cs-queue" }
